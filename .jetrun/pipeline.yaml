name: "Go Build & Test"

on:
  push:
    branches: ["main"]

stages:
  - name: lint
    steps:
      - name: Go vet
        run: go vet ./...
      - name: echo test
        run: echo 'test'
        parallel: true

  - name: test
    depends_on: [lint]
    steps:
      - name: Run tests
        run: go test -v ./...

  - name: build
    depends_on: [test]
    steps:
      - name: Build binary
        run: go build -o bin/app .
